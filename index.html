:root{

  --v-lib:#6cc8e8; --v-pc:#8ea8ff; --v-mard:#4fd1b9; --v-arb:#f2a650; --v-pce:#cf9cf0; --v-cph:#b9cf6a; --v-cgr:#e3b36a; --v-cav:#f08cc0; --v-adm:#6fd39a; --v-pen:#a3b0f5; --v-dsg:#e0a77c; --v-pac:#7cc9d4;

:root[data-theme="dark"]{

*{box-sizing:border-box}
html{background:var(--bg)}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--cover)}
a{color:var(--accent)}
/* Barre supérieure */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--cover);color:var(--cover-ink);box-shadow:0 1px 0 var(--cover-2)}
.top .in{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;display:flex;align-items:center;gap:10px;min-height:54px}
.top a.back{text-decoration:none;color:var(--cover-ink);font-weight:700;font-size:.92rem;padding:6px 10px 6px 4px;border-radius:8px}
.top a.back:hover{background:rgba(255,255,255,.12)}
.top .ttl{font-family:var(--f-display);font-weight:600;font-size:1.08rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.005em}
.top .act{display:flex;gap:4px}

.top .act a:hover,.top .act a.on{background:rgba(255,255,255,.14)}
.top .act svg{width:20px;height:20px}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 80px}
/* Typographie */
.eyebrow{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}

p{margin:0 0 10px;max-width:68ch}
.muted{color:var(--muted)} .small{font-size:.86rem}
.lead{color:var(--muted);max-width:62ch;font-size:1.02rem}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);min-width:0}
.stack{display:grid;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.ref{font-family:var(--f-mono);font-size:.76rem;color:var(--accent)}
.tag{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;background:color-mix(in srgb,var(--vc,var(--accent)) 13%,transparent);color:var(--vc,var(--accent));padding:3px 8px;border-radius:6px;display:inline-block;font-weight:500}
/* Couverture d'accueil */
.cover{position:relative;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-top:-22px;padding:30px max(16px,env(safe-area-inset-left,0px)) 26px;background:linear-gradient(160deg,var(--cover) 0%,var(--cover-2) 100%);color:var(--cover-ink);overflow:hidden}
@media (min-width:860px){.cover{margin-inline:0;border-radius:0 0 22px 22px;padding-inline:32px}}
.cover::before,.cover::after{content:"";position:absolute;left:0;right:0;height:5px;border-top:1px solid var(--gilt);border-bottom:1px solid var(--gilt);opacity:.75}
.cover::before{top:12px} .cover::after{bottom:12px}
.cover .eyebrow{color:var(--gilt)}
.cover h1{color:var(--cover-ink);font-size:clamp(2rem,7vw,3rem);margin-bottom:6px}
.cover .lead{color:color-mix(in srgb,var(--cover-ink) 82%,transparent)}
.cover .maj{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;color:var(--gilt);margin-top:4px}
.cover .stats{margin-top:18px}
.cover .stats div{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.18);box-shadow:none}
.cover .stats b{color:var(--cover-ink)} .cover .stats span{color:color-mix(in srgb,var(--cover-ink) 75%,transparent)}
.cover .chip{background:transparent;border-color:rgba(255,255,255,.35);color:var(--cover-ink)}
.cover .chip.on{background:var(--gilt);border-color:var(--gilt);color:#2a1a05}
.cover .concinfo{font-size:.86rem;color:color-mix(in srgb,var(--cover-ink) 85%,transparent);margin:10px 0 0;max-width:70ch}
.cover a{color:var(--gilt)}
/* Tuiles */
.grid{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:560px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))} .grid a.tile.wide{grid-column:span 2}}
@media (min-width:780px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
a.tile{position:relative;display:flex;flex-direction:column;gap:4px;text-decoration:none;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 16px 15px;min-width:0;box-shadow:var(--shadow);transition:transform .15s ease,border-color .15s ease}
a.tile:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--vc,var(--accent)) 55%,var(--line))}
a.tile b{font-family:var(--f-display);font-weight:600;font-size:1.06rem}
a.tile span{font-size:.84rem;color:var(--muted)}
a.tile .n{font-family:var(--f-mono);font-size:.72rem;color:var(--vc,var(--accent));letter-spacing:.02em}
a.tile .ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--vc,var(--accent)) 12%,transparent);color:var(--vc,var(--accent));margin-bottom:6px}
a.tile .ico svg{width:21px;height:21px}
@media (max-width:559px){a.tile{display:grid;grid-template-columns:40px 1fr;column-gap:14px;row-gap:2px;align-items:start;padding:14px} a.tile .ico{grid-row:1 / span 3;margin:2px 0 0}}
.grp{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px;display:flex;align-items:center;gap:10px}
.grp::after{content:"";flex:1;height:1px;background:var(--line)}
.volets{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 4px}
.vchip{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-size:.84rem;font-weight:700;padding:7px 12px;border-radius:999px;background:var(--paper);border:1px solid var(--line);color:var(--ink);box-shadow:var(--shadow)}
.vchip i{width:10px;height:10px;border-radius:50%;background:var(--vc)}
.chip{font:inherit;font-size:.8rem;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--muted);cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
/* Contrôles */
select,input,button,textarea{font:inherit;font-size:.92rem}
select,input[type=date],input[type=number],input[type=search],textarea{padding:9px 11px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;max-width:100%}
textarea{width:100%;min-height:90px;resize:vertical;line-height:1.5}
.btn{padding:9px 15px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:.9rem;transition:background .15s ease,border-color .15s ease}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ok{border-color:var(--ok);color:var(--ok)} .btn.ko{border-color:var(--ko);color:var(--ko)}
.btn[disabled]{opacity:.45;cursor:default}
a:focus-visible,.btn:focus-visible,.chip:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,label.opt:focus-within,summary:focus-visible,.star:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{height:7px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 70%,var(--gilt)));border-radius:4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stats div{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center;box-shadow:var(--shadow)}
.stats b{display:block;font-family:var(--f-display);font-size:1.45rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.stats span{font-size:.74rem;color:var(--muted)}
/* QCM */
.opts{display:grid;gap:8px;margin-top:12px}
label.opt{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--paper);transition:border-color .15s ease}

label.opt span.t{min-width:0}
label.opt.good{border-color:var(--ok);background:var(--ok-soft)} label.opt.bad{border-color:var(--ko);background:var(--ko-soft)} label.opt.miss{border-color:var(--ok);border-style:dashed}
.q-text{font-family:var(--f-display);font-weight:500;font-size:1.16rem;line-height:1.45}
.v-ok{color:var(--ok);font-weight:700} .v-ko{color:var(--ko);font-weight:700}
.expl{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.avenir{margin:14px 0 18px;padding:12px 14px;border:1px solid var(--warn);background:var(--warn-soft);border-radius:10px}.avenir .eyebrow{color:var(--warn)}.avenir p{margin:6px 0 0;font-size:.94rem}
.fx{list-style:none;margin:8px 0 10px;padding:0;display:grid;gap:6px}.fx li{font-size:.92rem;line-height:1.5;padding:6px 10px;border-left:3px solid var(--accent);background:color-mix(in srgb,var(--accent) 7%,transparent);border-radius:0 6px 6px 0}

.boxes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}

.boxes b{display:block;font-family:var(--f-mono);font-size:1rem;color:var(--ink);font-weight:500}
/* Tableaux */
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:.88rem}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}

.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}

.field{display:flex;flex-direction:column;gap:5px;min-width:0}

.f2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.big{font-family:var(--f-display);font-weight:600;font-size:1.5rem;line-height:1.3}
ol.steps{padding-left:20px;font-size:.9rem;margin:10px 0 0} ol.steps li{margin-bottom:4px}
.warn{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:9px 12px;font-size:.86rem;margin-top:10px}
.corr{background:var(--accent-soft);border-radius:10px;padding:13px 14px;margin-top:8px;font-size:.94rem}

.sec{scroll-margin-top:70px}
.sec p{font-size:.98rem}
.sec h3{display:flex;align-items:baseline;gap:8px}
.sec h3::before{content:"§";font-family:var(--f-display);color:var(--vc,var(--accent));font-weight:700}
.note{margin-top:28px;font-size:.8rem;color:var(--muted)} .note a{color:var(--accent)}
[hidden]{display:none!important}
.install{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
/* Favoris et recherche */
.star{flex:none;display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--paper);color:var(--muted);cursor:pointer;padding:0}
.star svg{width:18px;height:18px}
.star.on{color:var(--gilt);border-color:var(--gilt);background:color-mix(in srgb,var(--gilt) 14%,transparent)}
.star.on svg path{fill:currentColor}
.searchbox{display:flex;gap:8px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:6px 6px 6px 14px;box-shadow:var(--shadow)}
.searchbox svg{width:20px;height:20px;color:var(--muted);flex:none}

.hit{display:block;text-decoration:none;color:var(--ink)}
.hit .snip{font-size:.88rem;color:var(--muted);margin:4px 0 0}
/* Impression */
.printonly{display:none}
@media print{

}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:.88rem;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;z-index:20;box-shadow:var(--shadow)}

@media (prefers-reduced-motion: reduce){*{transition:none!important}}
